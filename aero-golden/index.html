<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Windows 7 Emulator · Aero Golden Desktop</title>
<style>
:root{--accent:#1674b9;--gold:#e3b34c;--glass:rgba(12,58,96,.82);--text:#17344b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:13px "Segoe UI",Tahoma,sans-serif;color:var(--text)}body{background:#126f9e url('https://lrfeditor1807.github.io/WallpaperPack/win7/Windows/img0.jpg') center/cover fixed}button,input,textarea,select{font:inherit}button{cursor:pointer}.desktop{height:100%;position:relative;padding:14px}.desktop-icons{display:flex;flex-direction:column;gap:13px;width:90px}.desktop-icon{color:#fff;text-align:center;text-shadow:1px 1px 3px #000;padding:5px 2px;border:1px solid transparent;border-radius:3px;user-select:none}.desktop-icon:hover{background:#ffffff32;border-color:#ffffff77}.desktop-icon .ico{display:block;font-size:30px;line-height:37px}.desktop-icon span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.window{position:absolute;min-width:340px;min-height:210px;background:#f7fbffef;border:1px solid #285c7f;border-radius:8px 8px 3px 3px;box-shadow:0 10px 32px #002b4c99,inset 0 0 0 1px #ffffffaa;overflow:hidden;resize:both}.titlebar{height:35px;padding:4px 7px 4px 11px;display:flex;align-items:center;justify-content:space-between;color:white;background:linear-gradient(#77c5f4,#2475b7 50%,#145b9a 52%,#4b9bd0);text-shadow:1px 1px 2px #16466b;user-select:none}.title{font-weight:bold;display:flex;gap:7px;align-items:center}.window-actions{display:flex;gap:3px}.window-actions button{width:25px;height:22px;color:#fff;border:1px solid #b9ddf4;border-radius:3px;background:linear-gradient(#8dcaef,#2878bb);line-height:15px}.window-actions button:last-child{background:linear-gradient(#e98b8b,#a81927)}.content{height:calc(100% - 35px);padding:13px;overflow:auto;background:linear-gradient(#f8fcff,#e9f3fa)}.card,.panel{background:#fff;border:1px solid #b5c9d7;border-radius:5px;padding:11px;margin:8px 0;box-shadow:0 1px 3px #7893aa33}.hero{padding:17px;border-radius:5px;color:#fff;background:linear-gradient(135deg,#075a98dd,#27a0d8bb)}.hero h1{margin:0 0 5px;font-size:23px}.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:5px;background:#e8f1f9;border-bottom:1px solid #b5c9d9}.toolbar button,.link-button,.action{border:1px solid #9bb5c8;border-radius:3px;padding:5px 10px;color:#163b57;background:linear-gradient(#fff,#d9e8f4)}.toolbar button:hover,.link-button:hover,.action:hover{background:#c6e5fa}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}.app-tile{padding:11px 7px;text-align:center;border:1px solid #aac5d8;border-radius:5px;background:linear-gradient(#fff,#e7f2fa)}.app-tile:hover{background:#cfeafb}.app-tile b{display:block;font-size:25px;margin-bottom:4px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photos img{width:100%;height:90px;object-fit:cover;border-radius:4px;border:2px solid #fff;box-shadow:0 1px 4px #456}.media-controls{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px}.media-controls button{border-radius:20px;border:1px solid #79a8c6;background:#effaff;padding:8px 11px}.status{padding:6px;color:#335;background:#eaf3fa;border-top:1px solid #b7cbd9}textarea{width:100%;height:190px;resize:none;border:1px solid #9eb7ca;padding:9px}.calc{max-width:260px;margin:auto}.calc input{width:100%;padding:10px;text-align:right;font-size:20px}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:5px}.calc-grid button{padding:10px;border:1px solid #9bb5c8;background:#eef7fc}.cards{display:flex;flex-wrap:wrap;gap:8px}.playing-card{width:45px;height:63px;border-radius:4px;border:1px solid #789;background:#fff;text-align:center;padding-top:18px;font-size:20px;box-shadow:1px 2px 3px #789}.playing-card.red{color:#c22}.taskbar{position:absolute;left:0;right:0;bottom:0;height:50px;display:flex;align-items:center;padding:3px 7px;gap:5px;color:#fff;background:linear-gradient(90deg,#07345fd9,#176ba5db 50%,#082c54e8);border-top:1px solid #a8def8;box-shadow:0 -2px 10px #03436c}.start-button{width:45px;height:43px;border-radius:50%;font-size:25px;border:2px solid #bfe9ff;background:radial-gradient(circle at 35% 30%,#d8f6ff,#3a9bd0 45%,#0b4e94);box-shadow:0 0 8px #a8e9ff}.task-item{width:45px;height:41px;border:1px solid #77b6df88;border-radius:4px;background:#ffffff1b;font-size:21px;color:#fff}.task-item:hover,.task-item.active{background:#b4e6ff55;box-shadow:inset 0 0 10px #bcecff}.tray{margin-left:auto;display:flex;align-items:center;gap:10px;padding:0 8px}.clock{text-align:right;min-width:67px}.start-menu{display:none;position:absolute;bottom:50px;left:5px;width:430px;height:470px;z-index:1001;background:linear-gradient(90deg,#eaf4fd,#fff);border:1px solid #346382;border-radius:6px 6px 0 0;box-shadow:0 0 22px #002e4c99}.start-menu.open{display:flex}.user-banner{position:absolute;top:0;left:0;right:0;padding:12px;color:#fff;background:linear-gradient(90deg,#276ca6,#8fcdf0);font-size:16px}.menu-list{flex:1;padding:65px 8px 8px;overflow:auto}.menu-list.right{background:#eaf3fa;border-left:1px solid #c1d4e3;padding-top:65px}.search{margin:0 0 7px;padding:7px 9px;width:100%;border:1px solid #829db2;border-radius:3px}.results{max-height:110px;overflow:auto;background:#fff}.results div,.menu-entry{padding:8px;border-radius:3px;display:flex;gap:8px;align-items:center}.results div{border-bottom:1px solid #ddd;cursor:pointer}.menu-entry:hover,.results div:hover{background:#c7e7fb}.toast{position:absolute;left:50%;bottom:65px;transform:translateX(-50%);z-index:3000;color:#fff;background:#073e69dd;border:1px solid #bdeaff;border-radius:4px;padding:9px 15px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.aero-gold{--accent:#b47b14}.gold-glass .titlebar{background:linear-gradient(#f4da85,#b47b14 50%,#815707 52%,#d7a632)}.gold-glass .taskbar{background:linear-gradient(90deg,#51320ddd,#b47b14dd 50%,#3a230ee8)}@media(max-width:650px){.start-menu{width:calc(100% - 10px)}.window{left:3%!important;top:4%!important;width:94%!important;height:72%!important}.task-item{width:39px}}
</style></head>
<body><main id="desktop" class="desktop"><div class="desktop-icons">
<div class="desktop-icon" data-open="computer"><span class="ico">💻</span><span>Computer</span></div><div class="desktop-icon" data-open="files"><span class="ico">📁</span><span>File Manager</span></div><div class="desktop-icon" data-open="notepad"><span class="ico">📝</span><span>Notepad</span></div><div class="desktop-icon" data-open="solitaire"><span class="ico">🃏</span><span>Solitaire</span></div><div class="desktop-icon" data-open="media"><span class="ico">🎞️</span><span>Media Center</span></div></div>
<section id="windows"></section><div id="toast" class="toast" role="status"></div>
<div id="startMenu" class="start-menu"><div class="user-banner">👤 <b>Windows 7 Emulator</b><br><small>Aero Golden Desktop</small></div><div class="menu-list"><input id="menuSearch" class="search" placeholder="Search programs and files"><div id="results" class="results"></div><div id="programs"></div></div><div class="menu-list right"><div class="menu-entry" data-open="computer">💻 Computer</div><div class="menu-entry" data-open="files">📁 Documents</div><div class="menu-entry" data-open="personalization">🎨 Personalization</div><div class="menu-entry" data-open="outlook">✉️ Outlook</div><div class="menu-entry" data-open="settings">⚙️ Control Panel</div><div class="menu-entry" data-open="player">▶️ Windows Media Player</div><div class="menu-entry" data-open="media">🎞️ Windows Media Center</div></div></div>
<nav class="taskbar" aria-label="Windows taskbar"><button class="start-button" id="start">⊞</button><button class="task-item" title="Google Chrome" data-open="chrome">🌐</button><button class="task-item" title="File Manager" data-open="files">📁</button><button class="task-item" title="Solitaire" data-open="solitaire">🃏</button><button class="task-item" title="Windows Media Center" data-open="media">🎞️</button><button class="task-item" title="Calculator" data-open="calculator">🧮</button><button class="task-item" title="Windows Media Player" data-open="player">▶️</button><div class="tray">🔊 📶<span class="clock" id="clock"></span></div></nav></main>
<script>
const wallpaper={Windows:'https://lrfeditor1807.github.io/WallpaperPack/win7/Windows/img0.jpg',Characters:'https://lrfeditor1807.github.io/WallpaperPack/win7/Characters/img21.jpg',Landscape:'https://lrfeditor1807.github.io/WallpaperPack/win7/Landscapes/img7.jpg',Nature:'https://lrfeditor1807.github.io/WallpaperPack/win7/Nature/img6.jpg'};
const apps={
notepad:['📝','Notepad',()=>`<div class="toolbar"><button onclick="saveNote()">💾 Save</button><button onclick="window.print()">🖨 Print</button></div><textarea id="note" placeholder="Type your note here...">${localStorage.note||''}</textarea>`],
wordpad:['📄','WordPad',()=>`<div class="toolbar"><button onclick="document.execCommand('bold')"><b>B</b></button><button onclick="document.execCommand('italic')"><i>I</i></button><button onclick="window.print()">🖨 Print</button></div><div contenteditable="true" class="card" style="min-height:220px">Welcome to WordPad</div>`],
quicknotes:['📌','Quick notes',()=>`<div class="hero"><h1>Quick notes</h1><p>Pin reminders to your desktop.</p></div><textarea placeholder="Write a quick note..."></textarea>`],
calculator:['🧮','Calculator',()=>`<div class="calc"><input id="calcOut" readonly value="0"><div class="calc-grid">${['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','C','+','=','%','⌫'].map(x=>`<button onclick="calc('${x}')">${x}</button>`).join('')}</div></div>`],
calendar:['📅','Calendar',()=>`<div class="hero"><h1>September 2026</h1><p>Today is ${new Date().toLocaleDateString()}</p></div><div class="card">📆 Calendar appointments and reminders are ready.</div>`],
outlook:['✉️','Outlook',()=>`<div class="toolbar"><button>➕ Add mail</button><button>📁 Add folder</button><button>☑️ Select</button><button>🗑 Delete folder</button></div><div class="grid"><div class="card"><b>Inbox</b><p>Welcome to Outlook</p><p>Windows 7 Emulator team</p></div><div class="card"><b>Sent Items</b><p>No sent messages.</p><b>Deleted Items</b><p>Deleted Messages Sample Folder</p></div></div><div class="status">Mail from: <input placeholder="name@example.com"> &nbsp; To: <input placeholder="recipient@example.com"></div>`],
solitaire:['🃏','Solitaire',()=>`<div class="hero"><h1>♠ Solitaire</h1><p>Classic Klondike patience game.</p><button class="link-button" onclick="newGame()">Deal new game</button> <a class="link-button" target="_blank" href="https://en.wikipedia.org/wiki/Solitaire">About Solitaire on Wikipedia</a></div><div class="card"><h3>Cards for Solitaire</h3><div class="cards">${['A♠','K♥','Q♦','J♣','10♠','9♥','8♦','7♣'].map((c,i)=>`<div class="playing-card ${i%2?'red':''}">${c}</div>`).join('')}</div></div>`],
chrome:['🌐','Google Chrome',()=>`<div class="toolbar"><button onclick="history.back()">←</button><button onclick="location.reload()">↻</button><input id="address" style="flex:1" value="https://www.google.com"><button onclick="browse()">Search</button></div><div class="hero"><h1>Google Chrome</h1><p>Search Google or enter a web address.</p><input id="chromeSearch" style="width:80%;padding:10px" placeholder="Search Google"><button onclick="browse()">Google</button></div><div class="card"><b>Jump List</b><p>Open app · Exit app · Open video player · Open music player · Open new tab</p></div>`],
files:['📁','File Manager',()=>`<div class="toolbar"><button onclick="say('New folder created')">📁 New folder</button><button onclick="say('This computer has 128 GB available')">💽 Properties</button></div><div class="card"><h3>Computer</h3><p>💽 Local Disk (C:) — 128 GB free</p><p>📂 Documents &nbsp; 📂 Pictures &nbsp; 📂 Music &nbsp; 📂 Videos</p></div>`],
media:['🎞️','Windows Media Center',()=>`<div class="hero"><h1>✺ Windows Media Center</h1><p>Watch and listen to videos, music, TV, movies and photos on your PC.</p></div><div class="grid">${[['📷','Photos & videos'],['🎵','Music'],['🎬','Movies'],['📺','Live TV'],['⚙️','Settings']].map(x=>`<div class="app-tile" onclick="say('${x[1]} opened')"><b>${x[0]}</b>${x[1]}</div>`).join('')}</div><div class="card"><h3>Watch and Listen</h3><iframe width="100%" height="180" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Rick Astley video" allowfullscreen></iframe><p>Live TV: Nickelodeon · HBO · MTV · TVN Chile</p></div>`],
player:['▶️','Windows Media Player',()=>`<div class="hero"><h1>Windows Media Player</h1><p>Play in Videos, Music, Photos and Recorded TV.</p></div><div class="media-controls"><button onclick="say('Previous all')">⏮</button><button onclick="say('Playing')">▶ Play</button><button onclick="say('Paused')">⏸ Pause</button><button onclick="say('Next all')">⏭</button><button onclick="say('10 seconds back')">↶ 10s</button><button onclick="say('10 seconds forward')">↷ 10s</button><button onclick="say('Recording video player')">⏺ Record video</button><button onclick="say('Recording music player')">⏺ Record music</button></div><div class="card">🎞️ Now playing · Windows 7 sample media<br><a target="_blank" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">Watch on YouTube</a> · <a href="https://www.facebook.com/" target="_blank">Facebook</a> · <a href="https://twitter.com/" target="_blank">Twitter</a></div>`],
vcl:['📺','VLC Media Player',()=>`<div class="hero"><h1>🔶 VLC Media Player</h1><p>Play local video and stream to your devices.</p></div><div class="media-controls"><button>▶ Play</button><button>⏸ Pause</button><button>⏺ Record</button><button>⏮ Previous</button><button>⏭ Next</button><button>↶ 10s</button><button>↷ 10s</button></div><div class="card">File Video MP4 <input type="file" accept="video/mp4,video/*"><p>DirectStream to cable or USB TV · Roku Express · Chromecast · TV Box · Fire TV Stick</p></div>`],
sound:['🎙️','Sound Recorder',()=>`<div class="card" style="text-align:center"><div style="font-size:60px">🎙️</div><button class="link-button" onclick="say('Recording started')">⏺ Start recording</button> <button class="link-button" onclick="say('Recording stopped')">⏹ Stop</button></div><p>Sound Effects: Characters · Landscape · Windows 7 system sounds</p><div class="grid">${[['Exclamation','https://www.myinstants.com/instant/windows-7-exclamation-sound-39691'],['Shutdown','https://www.myinstants.com/instant/windows-7-shutdown-89867'],['Logoff','https://www.myinstants.com/instant/windows-7-logoff-11101'],['Logon','https://www.myinstants.com/instant/windows-7-logon-sound-73793'],['Error','https://www.myinstants.com/instant/windows-7-error-53104'],['Critical Stop','https://www.myinstants.com/instant/windows-7-critical-stop-sound-25563'],['Notify','https://www.myinstants.com/instant/windows-notify-sound-58618'],['Messenger Online','https://www.myinstants.com/instant/windows-live-messenger-online-sound-87346'],['Media Center Startup','https://www.myinstants.com/instant/windows-7-media-center-startup-5071']].map(x=>`<a class="app-tile" target="_blank" href="${x[1]}">🔊 ${x[0]}</a>`).join('')}</div>`],
magnifier:['🔍','Magnifier',()=>`<div class="hero"><h1>🔍 Magnifier</h1><p>Use browser zoom to magnify the desktop.</p><button onclick="document.body.style.zoom='125%'">Zoom in</button> <button onclick="document.body.style.zoom='100%'">100%</button></div>`],
xps:['📚','XPS Viewer',()=>`<div class="card"><h3>XPS Viewer</h3><p>Open and view XPS documents.</p><input type="file" accept=".xps"><p class="status">No document selected.</p></div>`],
purble:['🧸','Purble Place',()=>`<div class="hero"><h1>🧸 Purble Place</h1><p>Playhouse games are ready to launch.</p></div><div class="grid"><div class="app-tile" onclick="say('Comfy Cakes started')"><b>🍰</b>Comfy Cakes</div><div class="app-tile" onclick="say('Purble Shop started')"><b>🧵</b>Purble Shop</div><div class="app-tile" onclick="say('Purble Pairs started')"><b>🃏</b>Purble Pairs</div></div>`],
chess:['♟️','Chess Titans',()=>`<div class="hero"><h1>♟ Chess Titans</h1><p>Choose a side and start a new game.</p><button onclick="say('New chess game')">New game</button></div><div class="card" style="font-size:28px;letter-spacing:8px">♜♞♝♛♚♝♞♜<br>♟♟♟♟♟♟♟♟<br>▫️▫️▫️▫️▫️▫️▫️▫️<br>▫️▫️▫️▫️▫️▫️▫️▫️</div>`],
powerpoint:['📊','PowerPoint',()=>`<div class="hero"><h1>PowerPoint</h1><p>Presentation viewer</p></div><div class="card"><h2>Windows 7 Emulator</h2><p>Aero Golden desktop presentation</p><button onclick="say('New slide')">New slide</button></div>`],
personalization:['🎨','Personalization',()=>`<div class="hero"><h1>Personalization</h1><p>Choose a Windows 7 wallpaper, glass color, screen saver and sound theme.</p></div><div class="photos">${Object.entries(wallpaper).map(([n,u])=>`<button class="card" onclick="setWallpaper('${u}')"><img src="${u}" alt="${n}"><b>${n}</b></button>`).join('')}</div><div class="card"><b>Colors</b><p>${['#c73535','#1674b9','#398c4a','#e07820','#e3b34c'].map(c=>`<button style="background:${c};width:35px;height:25px;border:2px solid #fff" onclick="setColor('${c}')"></button>`).join('')}</p><p>Screensaver: Bubbles · Photo Library</p><p>Aero Glass · Aero Golden Glass · Windows Glass Colors</p></div>`],
computer:['💻','Computer',()=>`<div class="hero"><h1>Computer</h1><p>Full computer: 1B GB memory · unlimited internet</p></div><div class="card">💽 Local Disk (C:) — 128 GB free<br>📁 Libraries · 🖼 Photo Library · 🎵 Music · 🎬 Videos</div>`],
settings:['⚙️','Control Panel',()=>`<div class="hero"><h1>Initial tasks</h1><p>Finish setting up Windows 7.</p></div><div class="grid"><div class="app-tile">👤 New Microsoft Account profile</div><div class="app-tile">🔒 Privacy & Security</div><div class="app-tile">🎁 Aero Golden: 1800 Coins · 30 Gems</div><div class="app-tile">🖼 100 Beginner Wallpapers</div></div><div class="card">Profile photo · Title · Date of birth · Windows XP 24 Years animated photo collection · Unlimited Windows Media Player 30 minutes</div>`]
};
const programOrder=[['notepad','📝 Notepad'],['solitaire','🃏 Solitaire'],['purble','🧸 Purble Place'],['chess','♟️ Chess Titans'],['xps','📚 XPS Viewer'],['powerpoint','📊 PowerPoint'],['vcl','🔶 VLC Media Player'],['sound','🎙️ Sound Recorder'],['magnifier','🔍 Magnifier'],['wordpad','📄 WordPad'],['quicknotes','📌 Quick notes'],['calculator','🧮 Calculator'],['calendar','📅 Calendar'],['outlook','✉️ Outlook'],['settings','⚙️ Initial tasks']];
function say(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.sayTimer);window.sayTimer=setTimeout(()=>x.classList.remove('show'),1800)}
function openApp(id){if(!apps[id])return;const old=document.querySelector(`.window[data-app="${id}"]`);if(old){old.style.zIndex=200;return}const [ico,title,body]=apps[id],w=document.createElement('article');w.className='window';w.dataset.app=id;w.style.left=(14+Math.random()*35)+'%';w.style.top=(7+Math.random()*28)+'%';w.style.width=id==='media'||id==='player'?'620px':'480px';w.style.height=id==='chrome'?'430px':'350px';w.innerHTML=`<header class="titlebar"><span class="title">${ico} ${title}</span><span class="window-actions"><button onclick="this.closest('.window').style.display='none'">—</button><button onclick="this.closest('.window').remove()">×</button></span></header><div class="content">${body()}</div>`;document.getElementById('windows').appendChild(w);makeDrag(w);say(title+' opened')}
function makeDrag(w){const bar=w.querySelector('.titlebar');bar.onmousedown=e=>{if(e.target.tagName==='BUTTON')return;const r=w.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top;const move=x=>{w.style.left=Math.max(0,x.clientX-ox)+'px';w.style.top=Math.max(0,x.clientY-oy)+'px'};document.addEventListener('mousemove',move);document.addEventListener('mouseup',()=>document.removeEventListener('mousemove',move),{once:true})}}
function setWallpaper(u){document.body.style.backgroundImage=`url('${u}')`;localStorage.wallpaper=u;say('Wallpaper changed')};function setColor(c){document.documentElement.style.setProperty('--accent',c);say('Glass color changed')};function saveNote(){localStorage.note=document.getElementById('note').value;say('Note saved locally')};function newGame(){say('New Solitaire game dealt')};function calc(x){const o=document.getElementById('calcOut');if(!o)return;if(x==='C')o.value='0';else if(x==='='){try{o.value=Function('return '+o.value.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-'))()}catch{o.value='Error'}}else if(x==='⌫')o.value=o.value.slice(0,-1)||'0';else o.value=o.value==='0'&&!['+','−','×','÷'].includes(x)?x:o.value+x}function browse(){const q=document.getElementById('chromeSearch')?.value||document.getElementById('address')?.value||'https://www.google.com';window.open(q.startsWith('http')?q:'https://www.google.com/search?q='+encodeURIComponent(q),'_blank')}
const programs=document.getElementById('programs');programs.innerHTML=programOrder.map(x=>`<div class="menu-entry" data-open="${x[0]}">${x[1]}</div>`).join('');document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>{openApp(e.dataset.open);document.getElementById('startMenu').classList.remove('open')});programs.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>{openApp(e.dataset.open);document.getElementById('startMenu').classList.remove('open')});document.getElementById('start').onclick=()=>document.getElementById('startMenu').classList.toggle('open');document.getElementById('menuSearch').oninput=e=>{const q=e.target.value.toLowerCase();document.getElementById('results').innerHTML=programOrder.filter(x=>x[1].toLowerCase().includes(q)||'images videos news web bing programs files'.includes(q)).map(x=>`<div data-open="${x[0]}">${x[1]}</div>`).join('')||'<div>Search images, videos, news and web on Bing</div>';document.querySelectorAll('#results [data-open]').forEach(n=>n.onclick=()=>openApp(n.dataset.open))};document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='p'){e.preventDefault();window.print()}if(e.ctrlKey&&e.key.toLowerCase()==='e'){e.preventDefault();openApp('files')}if(e.ctrlKey&&e.key.toLowerCase()==='a'){e.preventDefault();say('Jump List: Open app · Exit app · Open video player · Open music player · Open new tab')}if(e.ctrlKey&&e.key.toLowerCase()==='c')say('Copy');if(e.ctrlKey&&e.key.toLowerCase()==='v')say('Paste')});setInterval(()=>document.getElementById('clock').innerHTML=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'<br>'+new Date().toLocaleDateString(),1000);if(localStorage.wallpaper)setWallpaper(localStorage.wallpaper);
</script></body></html>
