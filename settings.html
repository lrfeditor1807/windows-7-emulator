<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control Panel · Windows 7</title>
  <style>
    :root{--accent:#2f80c0;--ink:#17344a;--muted:#587084}*{box-sizing:border-box}body{margin:0;min-height:100vh;font:14px "Segoe UI",Tahoma,sans-serif;color:var(--ink);background:linear-gradient(125deg,#dcecf8,#fff 48%,#d7e9f6)}header{padding:20px max(20px,calc((100% - 1080px)/2));color:#fff;background:linear-gradient(120deg,#28699f,#5eafe1);box-shadow:0 2px 8px #315d7a77}header small{opacity:.85}h1{margin:6px 0 0;font-size:27px;font-weight:400;text-shadow:1px 1px 2px #19517e}main{width:min(1080px,calc(100% - 28px));margin:22px auto;display:grid;grid-template-columns:250px 1fr;gap:18px}.panel,.sidebar{background:#ffffffde;border:1px solid #abc4d5;border-radius:6px;box-shadow:0 3px 12px #4f779622}.sidebar{padding:14px;align-self:start}.sidebar h2{font-size:17px;font-weight:400;margin:2px 0 12px}.nav{display:flex;gap:9px;align-items:center;width:100%;padding:11px 9px;border:0;border-radius:4px;text-align:left;color:var(--ink);background:transparent;cursor:pointer;font:inherit}.nav:hover,.nav.active{background:#d5ecfb;color:#084f84}.nav span{font-size:20px;width:25px;text-align:center}.panel{padding:22px}.intro{border-bottom:1px solid #cfdee8;padding-bottom:14px}.intro h2{margin:0 0 5px;color:#24577d;font-size:21px;font-weight:400}.intro p{margin:5px 0;color:var(--muted)}.settings{display:grid;gap:12px;margin-top:20px}.setting{display:grid;grid-template-columns:1fr minmax(180px,300px);gap:18px;align-items:center;padding:14px;border:1px solid #c1d5e2;border-radius:5px;background:#f8fcff}.setting label{font-weight:600}.setting small{display:block;margin-top:3px;color:var(--muted);font-weight:400}.control{justify-self:end;width:100%;padding:7px;border:1px solid #8daabe;border-radius:3px;background:white;color:var(--ink)}input[type=checkbox]{width:18px;height:18px;justify-self:start;accent-color:var(--accent)}input[type=color]{height:35px;padding:2px}.range-row{display:flex;gap:8px;align-items:center}.range-row input{flex:1}.range-row output{min-width:38px;text-align:right}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;padding-top:15px;border-top:1px solid #cfdee8}.action{padding:8px 18px;border:1px solid #7d9eb4;border-radius:3px;background:linear-gradient(#fff,#d8eaf6);cursor:pointer}.primary{color:#fff;border-color:#286b98;background:linear-gradient(#5aa9dc,#28699e)}.status{min-height:20px;margin-top:10px;color:#287041;font-size:12px}@media(max-width:700px){main{grid-template-columns:1fr}.setting{grid-template-columns:1fr}.control{justify-self:stretch}}
  </style>
</head>
<body>
  <header><small>Control Panel › All Control Panel Items</small><h1>Windows 7 Settings</h1></header>
  <main><aside class="sidebar"><h2>Control Panel</h2><div id="navigation"></div></aside><section class="panel"><div class="intro"><h2 id="title">Loading settings…</h2><p id="description"></p></div><form id="settings" class="settings"></form><div id="status" class="status" role="status"></div><div class="actions"><button type="button" class="action" id="reset">Cancel</button><button type="submit" class="action primary" form="settings">Save changes</button></div></section></main>
  <script>
    const state={data:null,category:null,values:{}};
    const $=id=>document.getElementById(id);
    const stored=()=>JSON.parse(localStorage.getItem('win7-settings')||'{}');
    async function load(){const [json,xml]=await Promise.all([fetch('data/settings.json').then(r=>r.json()),fetch('settings.xml').then(r=>r.text())]); if(!new DOMParser().parseFromString(xml,'application/xml').documentElement) throw Error('Invalid XML template'); state.data=json;state.category=location.hash.slice(1)||json.defaultCategory; if(!json.categories.some(c=>c.id===state.category))state.category=json.defaultCategory; renderNav();render();}
    function renderNav(){ $('navigation').innerHTML=state.data.categories.map(c=>`<button class="nav ${c.id===state.category?'active':''}" data-category="${c.id}"><span>${c.icon}</span>${c.title}</button>`).join('');document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{state.category=b.dataset.category;location.hash=state.category;renderNav();render()}); }
    function render(){const c=state.data.categories.find(x=>x.id===state.category);const saved=stored();$('title').textContent=`${c.icon} ${c.title}`;$('description').textContent=c.description;$('settings').innerHTML=c.settings.map(s=>{let v=saved[s.id]??s.value??'';if(s.type==='select')return `<div class="setting"><label>${s.label}</label><select class="control" name="${s.id}">${s.options.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select></div>`;if(s.type==='range')return `<div class="setting"><label>${s.label}</label><div class="range-row"><input class="control" type="range" name="${s.id}" min="${s.min}" max="${s.max}" value="${v}"><output>${v}%</output></div></div>`;if(s.type==='color')return `<div class="setting"><label>${s.label}</label><input class="control" type="color" name="${s.id}" value="${v}"></div>`;if(s.type==='button')return `<div class="setting"><label>${s.label}</label><button class="action" type="button" data-action="${s.action}">Create</button></div>`;if(s.type==='checkbox')return `<div class="setting"><label>${s.label}</label><input type="checkbox" name="${s.id}" ${v?'checked':''}></div>`;return `<div class="setting"><label>${s.label}</label><input class="control" name="${s.id}" value="${v}"></div>`}).join('');document.querySelectorAll('input[type=range]').forEach(i=>i.oninput=()=>i.nextElementSibling.value=i.value+'%');document.querySelectorAll('[data-action=restore]').forEach(b=>b.onclick=()=>show('Restore point created successfully.'));}
    function show(text){$('status').textContent=text;setTimeout(()=>$('status').textContent='',3500)}
    $('settings').onsubmit=e=>{e.preventDefault();const out=stored();new FormData(e.target).forEach((v,k)=>out[k]=v);e.target.querySelectorAll('input[type=checkbox]').forEach(i=>out[i.name]=i.checked);localStorage.setItem('win7-settings',JSON.stringify(out));show('Your Windows 7 settings have been saved.');};$('reset').onclick=()=>{localStorage.removeItem('win7-settings');render();show('Settings restored to their defaults.')};load().catch(e=>show('Could not load the settings manifest: '+e.message));
  </script>
</body>
</html>
